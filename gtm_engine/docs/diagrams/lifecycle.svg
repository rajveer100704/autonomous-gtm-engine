<svg viewBox="0 0 620 1150" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica,Arial,sans-serif">
  <rect width="620" height="1150" fill="#121417"/>
  <text x="310" y="34" fill="#E8E7E4" font-size="17" font-weight="700" text-anchor="middle">One lead's request lifecycle</text>

  <!-- helper: step template repeated -->
  <g font-size="12">
    <!-- 1 -->
    <rect x="160" y="60" width="300" height="46" rx="7" fill="#1B1F24" stroke="#2A2F36"/>
    <text x="310" y="88" fill="#E8E7E4" text-anchor="middle" font-weight="600">1. Apollo sources the lead</text>
    <line x1="310" y1="106" x2="310" y2="130" stroke="#2A2F36" stroke-width="1.5"/>

    <!-- 2 -->
    <rect x="160" y="130" width="300" height="46" rx="7" fill="#1B1F24" stroke="#2A2F36"/>
    <text x="310" y="158" fill="#E8E7E4" text-anchor="middle" font-weight="600">2. Enrichment normalizes it</text>
    <line x1="310" y1="176" x2="310" y2="200" stroke="#2A2F36" stroke-width="1.5"/>

    <!-- 3 cache check -->
    <rect x="140" y="200" width="340" height="56" rx="7" fill="#1B1F24" stroke="#35C4A1" stroke-width="1.5"/>
    <text x="310" y="224" fill="#35C4A1" text-anchor="middle" font-weight="600">3. Research cache check (per domain)</text>
    <text x="310" y="242" fill="#8B8F98" text-anchor="middle" font-size="10">hit → reuse summary · miss → Tavily search + Gemini</text>
    <line x1="310" y1="256" x2="310" y2="280" stroke="#2A2F36" stroke-width="1.5"/>

    <!-- 4 -->
    <rect x="160" y="280" width="300" height="46" rx="7" fill="#1B1F24" stroke="#2A2F36"/>
    <text x="310" y="308" fill="#E8E7E4" text-anchor="middle" font-weight="600">4. Pain point agent infers pains</text>
    <line x1="310" y1="326" x2="310" y2="350" stroke="#2A2F36" stroke-width="1.5"/>

    <!-- 5 -->
    <rect x="160" y="350" width="300" height="46" rx="7" fill="#1B1F24" stroke="#2A2F36"/>
    <text x="310" y="378" fill="#E8E7E4" text-anchor="middle" font-weight="600">5. A/B assigns a variant (A/B)</text>
    <line x1="310" y1="396" x2="310" y2="420" stroke="#2A2F36" stroke-width="1.5"/>

    <!-- 6 email -->
    <rect x="160" y="420" width="300" height="46" rx="7" fill="#1B1F24" stroke="#F4B860" stroke-width="1.5"/>
    <text x="310" y="448" fill="#F4B860" text-anchor="middle" font-weight="600">6. Email generated</text>
    <line x1="310" y1="466" x2="310" y2="490" stroke="#2A2F36" stroke-width="1.5"/>

    <!-- 7 reflect w/ loop -->
    <rect x="140" y="490" width="340" height="66" rx="7" fill="#1B1F24" stroke="#F4B860" stroke-width="1.5"/>
    <text x="310" y="514" fill="#F4B860" text-anchor="middle" font-weight="600">7. Reflection judges the draft</text>
    <text x="310" y="532" fill="#8B8F98" text-anchor="middle" font-size="10">score &lt; 80 → rewrite once with feedback, re-judge is skipped</text>
    <path d="M 480 523 C 540 523 540 460 462 443" fill="none" stroke="#8B8F98" stroke-width="1.2" stroke-dasharray="3,3"/>
    <text x="545" y="480" fill="#8B8F98" font-size="9">if rejected</text>
    <line x1="310" y1="556" x2="310" y2="580" stroke="#2A2F36" stroke-width="1.5"/>

    <!-- 8 linkedin -->
    <rect x="160" y="580" width="300" height="46" rx="7" fill="#1B1F24" stroke="#2A2F36"/>
    <text x="310" y="608" fill="#E8E7E4" text-anchor="middle" font-weight="600">8. LinkedIn message generated</text>
    <line x1="310" y1="626" x2="310" y2="650" stroke="#2A2F36" stroke-width="1.5"/>

    <!-- 9 crm -->
    <rect x="160" y="650" width="300" height="46" rx="7" fill="#1B1F24" stroke="#2A2F36"/>
    <text x="310" y="678" fill="#E8E7E4" text-anchor="middle" font-weight="600">9. Everything saved to CRM</text>
    <line x1="310" y1="696" x2="310" y2="720" stroke="#2A2F36" stroke-width="1.5"/>

    <!-- 10 send -->
    <rect x="160" y="720" width="300" height="46" rx="7" fill="#1B1F24" stroke="#2A2F36"/>
    <text x="310" y="748" fill="#E8E7E4" text-anchor="middle" font-weight="600">10. Email/LinkedIn sent</text>
    <line x1="310" y1="766" x2="310" y2="790" stroke="#2A2F36" stroke-width="1.5"/>

    <!-- 11 events -->
    <rect x="160" y="790" width="300" height="46" rx="7" fill="#1B1F24" stroke="#2A2F36"/>
    <text x="310" y="818" fill="#E8E7E4" text-anchor="middle" font-weight="600">11. Funnel + trace events recorded</text>
    <line x1="310" y1="836" x2="310" y2="860" stroke="#8B8F98" stroke-width="1.2" stroke-dasharray="3,3"/>
    <text x="330" y="852" fill="#8B8F98" font-size="9">later, async</text>

    <!-- 12 reply -->
    <rect x="140" y="860" width="340" height="56" rx="7" fill="#1B1F24" stroke="#E2A23B" stroke-width="1.5"/>
    <text x="310" y="884" fill="#E2A23B" text-anchor="middle" font-weight="600">12. Reply arrives → classified</text>
    <text x="310" y="902" fill="#8B8F98" text-anchor="middle" font-size="10">interested · not_now · OOO · not_interested · unsubscribe</text>
    <line x1="310" y1="916" x2="310" y2="940" stroke="#2A2F36" stroke-width="1.5"/>

    <!-- 13 adaptive -->
    <rect x="140" y="940" width="340" height="56" rx="7" fill="#1B1F24" stroke="#E2A23B" stroke-width="1.5"/>
    <text x="310" y="964" fill="#E2A23B" text-anchor="middle" font-weight="600">13. Follow-ups adapt</text>
    <text x="310" y="982" fill="#8B8F98" text-anchor="middle" font-size="10">cancelled · rescheduled · left alone</text>
    <line x1="310" y1="996" x2="310" y2="1020" stroke="#2A2F36" stroke-width="1.5"/>

    <!-- 14 analytics -->
    <rect x="160" y="1020" width="300" height="60" rx="7" fill="#1B1F24" stroke="#2A2F36"/>
    <text x="310" y="1046" fill="#E8E7E4" text-anchor="middle" font-weight="600">14. Analytics + observability update</text>
    <text x="310" y="1064" fill="#8B8F98" text-anchor="middle" font-size="10">funnel · A/B rates · cost · latency</text>
  </g>

  <text x="310" y="1120" fill="#8B8F98" font-size="10" text-anchor="middle">Every step is traced (see /observability) and every LLM call is cost-tracked (see /analytics/costs)</text>
</svg>
