<svg viewBox="0 0 980 620" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica,Arial,sans-serif">
  <rect width="980" height="620" fill="#121417"/>

  <!-- style helpers via repeated attrs -->
  <!-- Client / Console -->
  <rect x="40" y="30" width="220" height="60" rx="8" fill="#1B1F24" stroke="#2A2F36"/>
  <text x="150" y="55" fill="#E8E7E4" font-size="15" font-weight="600" text-anchor="middle">Console (web/index.html)</text>
  <text x="150" y="75" fill="#8B8F98" font-size="11" text-anchor="middle">Dashboard · Leads · Analytics · Observability</text>

  <rect x="720" y="30" width="220" height="60" rx="8" fill="#1B1F24" stroke="#2A2F36"/>
  <text x="830" y="55" fill="#E8E7E4" font-size="15" font-weight="600" text-anchor="middle">External caller</text>
  <text x="830" y="75" fill="#8B8F98" font-size="11" text-anchor="middle">ESP webhook → /events/track</text>

  <!-- API Gateway -->
  <rect x="340" y="130" width="300" height="60" rx="8" fill="#1B1F24" stroke="#F4B860" stroke-width="1.5"/>
  <text x="490" y="155" fill="#F4B860" font-size="15" font-weight="600" text-anchor="middle">FastAPI (api.py)</text>
  <text x="490" y="175" fill="#8B8F98" font-size="11" text-anchor="middle">/run-campaign · /analytics/* · /observability/* · /events/track</text>

  <line x1="150" y1="90" x2="480" y2="130" stroke="#2A2F36" stroke-width="1.5"/>
  <line x1="830" y1="90" x2="500" y2="130" stroke="#2A2F36" stroke-width="1.5"/>

  <!-- Orchestrator -->
  <rect x="365" y="230" width="250" height="50" rx="8" fill="#1B1F24" stroke="#2A2F36"/>
  <text x="490" y="260" fill="#E8E7E4" font-size="14" font-weight="600" text-anchor="middle">orchestrator.run_pipeline()</text>
  <line x1="490" y1="190" x2="490" y2="230" stroke="#2A2F36" stroke-width="1.5"/>

  <!-- Agent row -->
  <g font-size="12">
    <rect x="20" y="330" width="130" height="56" rx="7" fill="#1B1F24" stroke="#2A2F36"/>
    <text x="85" y="352" fill="#E8E7E4" text-anchor="middle" font-weight="600">Enrichment</text>
    <text x="85" y="368" fill="#8B8F98" text-anchor="middle" font-size="10">normalize lead</text>

    <rect x="165" y="330" width="130" height="56" rx="7" fill="#1B1F24" stroke="#35C4A1" stroke-width="1.5"/>
    <text x="230" y="352" fill="#35C4A1" text-anchor="middle" font-weight="600">Research</text>
    <text x="230" y="368" fill="#8B8F98" text-anchor="middle" font-size="10">Tavily + cache</text>

    <rect x="310" y="330" width="130" height="56" rx="7" fill="#1B1F24" stroke="#2A2F36"/>
    <text x="375" y="352" fill="#E8E7E4" text-anchor="middle" font-weight="600">Pain Point</text>
    <text x="375" y="368" fill="#8B8F98" text-anchor="middle" font-size="10">infer from research</text>

    <rect x="455" y="330" width="130" height="56" rx="7" fill="#1B1F24" stroke="#2A2F36"/>
    <text x="520" y="352" fill="#E8E7E4" text-anchor="middle" font-weight="600">A/B Assign</text>
    <text x="520" y="368" fill="#8B8F98" text-anchor="middle" font-size="10">variant A / B</text>

    <rect x="600" y="330" width="130" height="56" rx="7" fill="#1B1F24" stroke="#F4B860" stroke-width="1.5"/>
    <text x="665" y="352" fill="#F4B860" text-anchor="middle" font-weight="600">Email + Reflect</text>
    <text x="665" y="368" fill="#8B8F98" text-anchor="middle" font-size="10">judge, rewrite once</text>

    <rect x="745" y="330" width="130" height="56" rx="7" fill="#1B1F24" stroke="#2A2F36"/>
    <text x="810" y="352" fill="#E8E7E4" text-anchor="middle" font-weight="600">LinkedIn</text>
    <text x="810" y="368" fill="#8B8F98" text-anchor="middle" font-size="10">connection copy</text>
  </g>
  <line x1="490" y1="280" x2="490" y2="315" stroke="#2A2F36" stroke-width="1.5"/>
  <line x1="150" y1="315" x2="810" y2="315" stroke="#2A2F36" stroke-width="1.5"/>
  <line x1="85" y1="315" x2="85" y2="330" stroke="#2A2F36" stroke-width="1.5"/>
  <line x1="230" y1="315" x2="230" y2="330" stroke="#2A2F36" stroke-width="1.5"/>
  <line x1="375" y1="315" x2="375" y2="330" stroke="#2A2F36" stroke-width="1.5"/>
  <line x1="520" y1="315" x2="520" y2="330" stroke="#2A2F36" stroke-width="1.5"/>
  <line x1="665" y1="315" x2="665" y2="330" stroke="#2A2F36" stroke-width="1.5"/>
  <line x1="810" y1="315" x2="810" y2="330" stroke="#2A2F36" stroke-width="1.5"/>

  <!-- Followup / Reply -->
  <rect x="600" y="430" width="150" height="56" rx="7" fill="#1B1F24" stroke="#E2A23B" stroke-width="1.5"/>
  <text x="675" y="452" fill="#E2A23B" text-anchor="middle" font-weight="600" font-size="12">Reply Classifier</text>
  <text x="675" y="468" fill="#8B8F98" text-anchor="middle" font-size="10">adaptive follow-ups</text>

  <rect x="20" y="430" width="150" height="56" rx="7" fill="#1B1F24" stroke="#2A2F36"/>
  <text x="95" y="452" fill="#E8E7E4" text-anchor="middle" font-weight="600" font-size="12">Follow-up Scheduler</text>
  <text x="95" y="468" fill="#8B8F98" text-anchor="middle" font-size="10">APScheduler</text>

  <!-- CRM -->
  <rect x="310" y="530" width="360" height="60" rx="8" fill="#1B1F24" stroke="#2A2F36"/>
  <text x="490" y="555" fill="#E8E7E4" font-size="15" font-weight="600" text-anchor="middle">CRM (Postgres / SQLite via SQLAlchemy)</text>
  <text x="490" y="575" fill="#8B8F98" font-size="11" text-anchor="middle">leads · research · outreach · events · llm_usage · spans</text>

  <line x1="85" y1="386" x2="85" y2="430" stroke="#2A2F36" stroke-width="1.5"/>
  <line x1="230" y1="386" x2="95" y2="430" stroke="#2A2F36" stroke-width="1.5"/>
  <line x1="665" y1="386" x2="675" y2="430" stroke="#2A2F36" stroke-width="1.5"/>
  <line x1="810" y1="386" x2="675" y2="430" stroke="#2A2F36" stroke-width="1.5"/>
  <line x1="95" y1="486" x2="400" y2="530" stroke="#2A2F36" stroke-width="1.5"/>
  <line x1="675" y1="486" x2="580" y2="530" stroke="#2A2F36" stroke-width="1.5"/>

  <text x="490" y="615" fill="#8B8F98" font-size="10" text-anchor="middle">Autonomous GTM Engine — component architecture</text>
</svg>
