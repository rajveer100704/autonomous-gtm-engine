version: "3.9"

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: gtm
      POSTGRES_PASSWORD: gtm
      POSTGRES_DB: gtm
    volumes:
      - gtm_pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  api:
    build: .
    restart: on-failure
    depends_on:
      - db
      - jaeger
      - redis
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg2://gtm:gtm@db:5432/gtm
      REDIS_URL: redis://redis:6379/0
      USE_REDIS: "true"
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4317
    ports:
      - "8000:8000"

  scheduler:
    build: .
    restart: on-failure
    depends_on:
      - db
      - redis
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg2://gtm:gtm@db:5432/gtm
      REDIS_URL: redis://redis:6379/0
      USE_REDIS: "true"
    command: ["python", "-m", "gtm_engine.scheduler"]

  dashboard:
    build: .
    restart: on-failure
    depends_on:
      - db
      - redis
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg2://gtm:gtm@db:5432/gtm
      REDIS_URL: redis://redis:6379/0
      USE_REDIS: "true"
    command: ["streamlit", "run", "gtm_engine/dashboard.py", "--server.address=0.0.0.0"]
    ports:
      - "8501:8501"

  jaeger:
    image: jaegertracing/all-in-one:1.57
    ports:
      - "16686:16686" # Web UI
      - "4317:4317"   # OTLP gRPC receiver
      - "4318:4318"   # OTLP HTTP receiver

  prometheus:
    image: prom/prometheus:v2.52.0
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
    ports:
      - "9090:9090"
    depends_on:
      - api

  grafana:
    image: grafana/grafana:11.0.0
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
    depends_on:
      - prometheus

  redis:
    image: redis:7.2-alpine
    ports:
      - "6379:6379"

  worker:
    build: .
    restart: on-failure
    depends_on:
      - db
      - redis
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg2://gtm:gtm@db:5432/gtm
      REDIS_URL: redis://redis:6379/0
      USE_REDIS: "true"
    command: ["python", "-m", "gtm_engine.queues.worker"]

volumes:
  gtm_pgdata:
