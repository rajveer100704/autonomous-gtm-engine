<svg viewBox="0 0 1000 620" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica,Arial,sans-serif">
  <rect width="1000" height="620" fill="#121417"/>
  <text x="500" y="30" fill="#E8E7E4" font-size="16" font-weight="700" text-anchor="middle">Data model (SQLAlchemy — Postgres or SQLite)</text>

  <!-- leads: center hub -->
  <g>
    <rect x="410" y="260" width="180" height="120" rx="8" fill="#1B1F24" stroke="#F4B860" stroke-width="1.5"/>
    <text x="500" y="282" fill="#F4B860" font-size="13" font-weight="700" text-anchor="middle">leads</text>
    <text x="500" y="300" fill="#E8E7E4" font-size="10" text-anchor="middle">id · full_name · company</text>
    <text x="500" y="314" fill="#E8E7E4" font-size="10" text-anchor="middle">domain · title · email</text>
    <text x="500" y="328" fill="#E8E7E4" font-size="10" text-anchor="middle">status · created_at</text>
  </g>

  <!-- research -->
  <rect x="60" y="80" width="190" height="90" rx="8" fill="#1B1F24" stroke="#2A2F36"/>
  <text x="155" y="102" fill="#E8E7E4" font-size="12" font-weight="700" text-anchor="middle">research</text>
  <text x="155" y="120" fill="#8B8F98" font-size="9" text-anchor="middle">lead_id (FK) · summary</text>
  <text x="155" y="134" fill="#8B8F98" font-size="9" text-anchor="middle">signals · sources · confidence</text>

  <!-- research_cache (no FK, keyed by domain) -->
  <rect x="60" y="190" width="190" height="70" rx="8" fill="#1B1F24" stroke="#35C4A1" stroke-width="1.2"/>
  <text x="155" y="212" fill="#35C4A1" font-size="12" font-weight="700" text-anchor="middle">research_cache</text>
  <text x="155" y="228" fill="#8B8F98" font-size="9" text-anchor="middle">domain (unique) · summary</text>
  <text x="155" y="242" fill="#8B8F98" font-size="9" text-anchor="middle">sources · confidence · fetched_at</text>

  <!-- pain_points -->
  <rect x="60" y="280" width="190" height="70" rx="8" fill="#1B1F24" stroke="#2A2F36"/>
  <text x="155" y="302" fill="#E8E7E4" font-size="12" font-weight="700" text-anchor="middle">pain_points</text>
  <text x="155" y="318" fill="#8B8F98" font-size="9" text-anchor="middle">lead_id (FK) · pain_points</text>
  <text x="155" y="332" fill="#8B8F98" font-size="9" text-anchor="middle">confidence</text>

  <!-- outreach -->
  <rect x="60" y="370" width="190" height="100" rx="8" fill="#1B1F24" stroke="#2A2F36"/>
  <text x="155" y="392" fill="#E8E7E4" font-size="12" font-weight="700" text-anchor="middle">outreach</text>
  <text x="155" y="408" fill="#8B8F98" font-size="9" text-anchor="middle">lead_id (FK) · channel · step</text>
  <text x="155" y="422" fill="#8B8F98" font-size="9" text-anchor="middle">subject · body · variant</text>
  <text x="155" y="436" fill="#8B8F98" font-size="9" text-anchor="middle">status · scheduled_for</text>
  <text x="155" y="450" fill="#8B8F98" font-size="9" text-anchor="middle">sent_at</text>

  <!-- events -->
  <rect x="750" y="80" width="190" height="80" rx="8" fill="#1B1F24" stroke="#2A2F36"/>
  <text x="845" y="102" fill="#E8E7E4" font-size="12" font-weight="700" text-anchor="middle">events</text>
  <text x="845" y="118" fill="#8B8F98" font-size="9" text-anchor="middle">lead_id (FK) · event_type</text>
  <text x="845" y="132" fill="#8B8F98" font-size="9" text-anchor="middle">event_metadata · created_at</text>

  <!-- reply_classifications -->
  <rect x="750" y="180" width="190" height="80" rx="8" fill="#1B1F24" stroke="#E2A23B" stroke-width="1.2"/>
  <text x="845" y="202" fill="#E2A23B" font-size="12" font-weight="700" text-anchor="middle">reply_classifications</text>
  <text x="845" y="218" fill="#8B8F98" font-size="9" text-anchor="middle">lead_id (FK) · classification</text>
  <text x="845" y="232" fill="#8B8F98" font-size="9" text-anchor="middle">confidence · raw_reply</text>

  <!-- llm_usage -->
  <rect x="750" y="280" width="190" height="80" rx="8" fill="#1B1F24" stroke="#2A2F36"/>
  <text x="845" y="302" fill="#E8E7E4" font-size="12" font-weight="700" text-anchor="middle">llm_usage</text>
  <text x="845" y="318" fill="#8B8F98" font-size="9" text-anchor="middle">lead_id (FK) · agent</text>
  <text x="845" y="332" fill="#8B8F98" font-size="9" text-anchor="middle">input/output_tokens · cost_usd</text>

  <!-- spans -->
  <rect x="750" y="380" width="190" height="80" rx="8" fill="#1B1F24" stroke="#2A2F36"/>
  <text x="845" y="402" fill="#E8E7E4" font-size="12" font-weight="700" text-anchor="middle">spans</text>
  <text x="845" y="418" fill="#8B8F98" font-size="9" text-anchor="middle">trace_id · lead_id (FK) · agent</text>
  <text x="845" y="432" fill="#8B8F98" font-size="9" text-anchor="middle">duration_ms · success · error</text>

  <!-- ab_winner (global, no FK) -->
  <rect x="410" y="480" width="180" height="60" rx="8" fill="#1B1F24" stroke="#F4B860" stroke-width="1.2"/>
  <text x="500" y="502" fill="#F4B860" font-size="12" font-weight="700" text-anchor="middle">ab_winner</text>
  <text x="500" y="518" fill="#8B8F98" font-size="9" text-anchor="middle">test_name · variant · metric · value</text>

  <!-- connectors from leads to each -->
  <line x1="410" y1="290" x2="250" y2="125" stroke="#2A2F36" stroke-width="1.2"/>
  <line x1="410" y1="310" x2="250" y2="315" stroke="#2A2F36" stroke-width="1.2"/>
  <line x1="410" y1="330" x2="250" y2="420" stroke="#2A2F36" stroke-width="1.2"/>
  <line x1="590" y1="290" x2="750" y2="120" stroke="#2A2F36" stroke-width="1.2"/>
  <line x1="590" y1="310" x2="750" y2="220" stroke="#2A2F36" stroke-width="1.2"/>
  <line x1="590" y1="330" x2="750" y2="320" stroke="#2A2F36" stroke-width="1.2"/>
  <line x1="590" y1="350" x2="750" y2="420" stroke="#2A2F36" stroke-width="1.2"/>
  <line x1="500" y1="380" x2="500" y2="480" stroke="#2A2F36" stroke-width="1.2" stroke-dasharray="3,3"/>
  <text x="515" y="440" fill="#8B8F98" font-size="9">no FK — global per test_name</text>

  <text x="500" y="580" fill="#8B8F98" font-size="10" text-anchor="middle">research_cache is keyed by domain (not lead_id) — that's the cross-lead reuse mechanism</text>
</svg>
